name: Biotech IPO tracker

on:
  schedule:
    # 22:10 and 23:10 UTC on weekdays (after the close in PST and PDT); GitHub often runs late,
    # so two tries. Each run recomputes everything, so a second run is harmless.
    - cron: "10 22,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  ipo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Track biotech IPOs
        id: ipo
        continue-on-error: true
        run: |
          mkdir -p data/ipo
          set -o pipefail
          python ipo_tracker.py 2>&1 | grep -v "Pandas4Warning\|FutureWarning" | tee data/ipo/run_log.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "IPO tracker $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Fail the run if the script failed
        if: steps.ipo.outcome == 'failure'
        run: exit 1
