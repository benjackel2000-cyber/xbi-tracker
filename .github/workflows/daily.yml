name: Daily XBI contribution + catalyst news

on:
  schedule:
    # 21:30, 22:30 and 23:30 UTC on weekdays (all after the 1pm PT close, in PST and PDT).
    # GitHub often starts scheduled jobs hours late, so three tries make it likely one lands
    # before the 4:15pm PT evening sync. Once a run has finished for the day, later ones skip.
    - cron: "30 21,22,23 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab
    inputs:
      lookback_days:
        description: "How many days back to check FDA outcomes (default 14)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Already done today?
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime, zoneinfo
          et = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          try:
              done = json.load(open("data/latest.json"))["date"] == et.strftime("%Y-%m-%d")
              gen = json.load(open("data/catalyst_news/latest.json"))["generated_at"]
              done = done and datetime.datetime.fromisoformat(gen).astimezone(et.tzinfo).date() == et.date()
          except Exception:
              done = False
          manual = "${{ github.event_name }}" == "workflow_dispatch"
          print("skip=" + ("true" if done and not manual else "false"))
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Compute contributions
        if: steps.check.outputs.skip != 'true'
        id: compute
        continue-on-error: true
        run: |
          mkdir -p data
          set -o pipefail
          python xbi_contrib.py 2>&1 | tee data/run_log.txt

      - name: Check FDA decision outcomes
        if: steps.check.outputs.skip != 'true'
        id: outcomes
        continue-on-error: true
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          set -o pipefail
          python fda_outcomes.py 2>&1 | tee data/outcomes_log.txt

      - name: Catalyst news and trial readout checks
        if: steps.check.outputs.skip != 'true'
        id: catalysts
        continue-on-error: true
        run: |
          set -o pipefail
          python catalyst_news.py 2>&1 | tee data/catalyst_news_log.txt

      - name: Commit results (and the run log)
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "XBI contribution data $(date -u +%F)"
          git pull --rebase
          git push

      - name: Fail the run if the script failed
        if: steps.compute.outcome == 'failure' || steps.outcomes.outcome == 'failure' || steps.catalysts.outcome == 'failure'
        run: exit 1
