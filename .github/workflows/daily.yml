name: Daily XBI contribution

on:
  schedule:
    # 22:30 UTC on weekdays = 3:30pm PT (PDT) / 2:30pm PT (PST), after the 1pm PT close
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute contributions
        run: python xbi_contrib.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "XBI contribution data $(date -u +%F)"
          git push
