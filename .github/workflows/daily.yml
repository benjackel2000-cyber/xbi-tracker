name: Daily XBI contribution

on:
  schedule:
    # 22:30 UTC on weekdays = 3:30pm PT (PDT) / 2:30pm PT (PST), after the 1pm PT close
    - cron: "30 22 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab
    inputs:
      lookback_days:
        description: "How many days back to check FDA outcomes (default 14)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute contributions
        id: compute
        continue-on-error: true
        run: |
          mkdir -p data
          set -o pipefail
          python xbi_contrib.py 2>&1 | tee data/run_log.txt

      - name: Check FDA decision outcomes
        id: outcomes
        continue-on-error: true
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          set -o pipefail
          python fda_outcomes.py 2>&1 | tee data/outcomes_log.txt

      - name: Commit results (and the run log)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "XBI contribution data $(date -u +%F)"
          git pull --rebase
          git push

      - name: Fail the run if the script failed
        if: steps.compute.outcome == 'failure' || steps.outcomes.outcome == 'failure'
        run: exit 1
