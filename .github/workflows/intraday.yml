name: Intraday XBI snapshot

on:
  schedule:
    # 15:05, 17:05, 19:05 UTC on weekdays = 8:05/10:05/12:05 PT (PDT) or 7:05/9:05/11:05 PT (PST)
    - cron: "5 15,17,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: XBI snapshot so far today
        id: xbi
        continue-on-error: true
        run: |
          mkdir -p data/intraday
          set -o pipefail
          python xbi_intraday.py 2>&1 | grep -v "Pandas4Warning\|inplace\|whatsnew\|sort_index\|rename(columns" | tee data/intraday/run_log.txt

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Intraday snapshot $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Fail the run if a script failed
        if: steps.xbi.outcome == 'failure'
        run: exit 1
