name: debug
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python dbg/dbg.py > dbg/out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dbg/out.txt; git commit -m dbg; for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
